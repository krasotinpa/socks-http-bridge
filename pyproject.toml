[project]
name = "socks-http-bridge"
version = "0.1.0"
description = "Windows tray app bridging local HTTP proxy Listeners to one SOCKS5 Upstream"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pystray>=0.19",
    "Pillow>=10.0",
]

[project.scripts]
socks-http-bridge = "socks_http_bridge.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/socks_http_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = ["src"]
